version: '3.8'

services:
  cyp-induction-inhibition-tdi:
    build: .
    container_name: cyp-induction-inhibition-tdi
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=cyp-induction-inhibition-tdi-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
