[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyp-induction-inhibition-tdi"
version = "2.0.0"
description = "CYP-Kin: Time-Dependent Inhibition (TDI) & Kinact/KI Pharmacokinetic Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
cyp-induction-inhibition-tdi = "cyp_kinetics.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cyp-induction-inhibition-tdi"
Repository = "https://github.com/abusuraihsakhri/cyp-induction-inhibition-tdi.git"
