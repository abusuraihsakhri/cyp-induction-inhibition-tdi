name: Deploy Browser Calculator

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static calculator
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed page and JavaScript assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "${SITE_URL}" -o /tmp/tdi-page.html
          grep -Fq "CYP time-dependent inactivation" /tmp/tdi-page.html
          curl --fail --location --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "${SITE_URL}app.mjs" -o /tmp/tdi-app.mjs
          grep -Fq "calculateTdi" /tmp/tdi-app.mjs
          curl --fail --location --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "${SITE_URL}kinetics.mjs" -o /tmp/tdi-kinetics.mjs
          grep -Fq "export function calculateTdi" /tmp/tdi-kinetics.mjs
