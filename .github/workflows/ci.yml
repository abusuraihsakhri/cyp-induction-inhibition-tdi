name: Cyp Induction Inhibition Tdi CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[server,test]"

    - name: Check Python syntax and package build
      run: |
        python -m compileall -q agents cyp_kinetics cli.py enrichment.py simulator.py
        python -m build
        unzip -Z1 dist/*.whl | grep -q 'web/index.html'
        unzip -Z1 dist/*.whl | grep -q 'web/app.mjs'

    - name: Run Pytest Suite
      run: |
        python -m pytest -v

    - name: Validate browser JavaScript and kinetic model
      run: |
        node --check web/app.mjs
        node --check web/kinetics.mjs
        node --test web/kinetics.test.mjs

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
